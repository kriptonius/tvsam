<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Playlist Antonella 10 ✨</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#2c1810,#4a2c1a);color:#f5e6d3;min-height:100vh;padding:20px}
.container{max-width:1100px;margin:0 auto}
h1{text-align:center;color:#ffd700;font-size:2.4em;text-shadow:2px 2px 4px #000}
.subtitle{text-align:center;color:#f0e0c6;margin:6px 0 26px;font-size:1.15em}
.video-wrapper{position:relative;width:100%;max-width:880px;margin:0 auto 22px;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px #000;border:3px solid #ffd700}
.video-wrapper::before{content:'';display:block;padding-top:56.25%}
#player{position:absolute;inset:0;width:100%;height:100%}
.now-playing{background:rgba(255,215,0,.1);border:2px solid #ffd700;border-radius:14px;padding:16px;text-align:center;margin-bottom:22px}
.np-label{font-size:.85em;color:#f0e0c6}
.np-title{font-size:1.7em;color:#ffd700;font-weight:bold}
.np-artist{font-size:1.05em}
.controls{display:flex;justify-content:center;gap:12px;margin-bottom:26px;flex-wrap:wrap}
.btn{background:#8b5a2b;color:#fff;border:none;padding:12px 22px;border-radius:40px;cursor:pointer;font-size:15px;font-weight:bold;transition:.25s}
.btn:hover{background:#6b4423;transform:translateY(-2px)}
.btn.fs{background:#ffd700;color:#2c1810}
.playlist{background:rgba(255,255,255,.05);border-radius:14px;padding:18px;border:1px solid rgba(255,215,0,.3)}
.playlist h2{color:#ffd700;text-align:center;margin-bottom:14px}
.song{display:flex;align-items:center;gap:12px;padding:11px;margin-bottom:8px;background:rgba(255,255,255,.05);border-radius:10px;cursor:pointer;transition:.25s}
.song:hover{background:rgba(255,215,0,.15)}
.song.playing{background:rgba(255,215,0,.3);border-left:4px solid #ffd700;animation:pulse 2s infinite}
.num{font-weight:bold;color:#ffd700;min-width:30px;font-size:1.1em}
.info{flex:1}
.info .t{font-weight:bold;color:#f5e6d3}
.info .a{font-size:.85em;color:#d4b895}
.badge{background:#ffd700;color:#2c1810;padding:2px 9px;border-radius:14px;font-size:.75em;font-weight:bold}
.search-btn{background:none;border:1px solid #ffd700;color:#ffd700;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:14px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,.4)}50%{box-shadow:0 0 0 10px rgba(255,215,0,0)}}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#ffd700;color:#2c1810;padding:14px 26px;border-radius:14px;font-weight:bold;z-index:9999;box-shadow:0 6px 20px #000;animation:pop .4s}
@keyframes pop{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
body.fs-mode{padding:0;background:#000}
body.fs-mode .container>*:not(.video-wrapper){display:none}
body.fs-mode .video-wrapper{max-width:100%;height:100vh;border:none;border-radius:0}
body.fs-mode .video-wrapper::before{display:none}
.exit-fs{position:fixed;top:16px;right:16px;z-index:9999;background:#ffd700;color:#2c1810;border:none;padding:10px 18px;border-radius:40px;font-weight:bold;cursor:pointer;display:none}
body.fs-mode .exit-fs{display:block}
</style>
</head>
<body>
<div class="container">
  <h1>🎵 Playlist de Antonella ✨</h1>
  <p class="subtitle">¡10 Añitos de Pura Música Bonita! ☕👁️🐸</p>
  <div class="video-wrapper"><div id="player"></div></div>
  <div class="now-playing">
    <div class="np-label">🎶 AHORA SONANDO</div>
    <div class="np-title" id="curTitle">Preparando la fiesta…</div>
    <div class="np-artist" id="curArtist">Antonella 10</div>
  </div>
  <div class="controls">
    <button class="btn" onclick="prev()">⏮️ Anterior</button>
    <button class="btn" id="pp" onclick="togglePP()">⏸️ Pausa</button>
    <button class="btn" onclick="next()">⏭️ Siguiente</button>
    <button class="btn fs" onclick="fs()">📺 Pantalla Completa</button>
  </div>
  <div class="playlist"><h2>📋 Lista de Reproducción</h2><div id="list"></div></div>
</div>
<button class="exit-fs" onclick="fs()">✖ Salir</button>

<script>
const playlist = [
  {id:"qBN7eyI2CFU", title:"Mix Pocoyó", artist:"Corazón Serrano", pauseAfter:false},
  {id:"6mQRRiz_7xQ", title:"Y Que Pasó", artist:"Orquesta La Bella Luz", pauseAfter:false},
  {id:"wWDs2hBXcco", title:"Acróstico", artist:"Shakira", pauseAfter:false},
  {search:"WARMISITAY Milena Warthon video oficial", title:"Warmisitay", artist:"Milena Warthon", pauseAfter:false},
  {id:"AfJm4CtlcWA", title:"Six Seven", artist:"Laurinha Costa", pauseAfter:false},
  {id:"2BabCBQysrU", title:"Ojos Marrones 👁️", artist:"Lasso", pauseAfter:false},
  {search:"Pedazo de Luna León Zárate", title:"Pedazo de Luna", artist:"León Zárate", pauseAfter:false},
  {id:"IKmPci5VXz0", title:"Hasta la Raíz", artist:"Natalia Lafourcade", pauseAfter:false},
  {search:"Bonito, Bonito Thiago Navarro Music cafecito", title:"Bonito, Bonito ☕", artist:"Thiago Navarro Music", pauseAfter:true}, // ⏸️ PAUSA antes del cumple
  {id:"3k53XKibh5c", title:"🎂 ¡Feliz Cumpleaños Antonella! 🎂", artist:"¡Todos juntos!", pauseAfter:false, isBirthday:true}
];

let player, idx=0, playing=true;
const tag=document.createElement('script');tag.src="https://www.youtube.com/iframe_api";
document.getElementsByTagName('script')[0].parentNode.insertBefore(tag,document.getElementsByTagName('script')[0]);

function launchBirthdayConfetti() {
    if (typeof confetti !== 'function') return;
    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#ffd700', '#ff69b4', '#00bfff', '#ff4500'] });
    setTimeout(() => {
        confetti({ particleCount: 100, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffd700', '#ff69b4'] });
        confetti({ particleCount: 100, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#00bfff', '#ff4500'] });
    }, 400);
}

function onYouTubeIframeAPIReady(){
  const f=playlist[0], vars={autoplay:1,controls:1,rel:0,modestbranding:1,fs:0,playsinline:1};
  if(f.id) vars.videoId=f.id; else {vars.listType='search';vars.list=f.search;}
  player=new YT.Player('player',{height:'100%',width:'100%',playerVars:vars,
    events:{onReady:e=>{e.target.playVideo();render();setNow();},onStateChange:onState,onError:onErr}});
}

function onState(e){
  if(e.data===YT.PlayerState.ENDED){
    const s=playlist[idx];
    if(s.isBirthday){toast("🎉 ¡FELIZ CUMPLEAÑOS ANTONELLA! 🎉");return;}
    if(s.pauseAfter&&idx<playlist.length-1){toast("⏸️ Pausa programada — toca ▶️ Siguiente para seguir");return;}
    next();
  }
  if(e.data===YT.PlayerState.PLAYING && playlist[idx].isBirthday) {
      setTimeout(launchBirthdayConfetti, 800);
  }
}

function onErr(){toast("⚠️ No cargó, avanzando…");next();}

function play(i){
    idx=i; const s=playlist[i]; setNow(); hl();
    if(s.isBirthday) setTimeout(launchBirthdayConfetti, 1000);
    if(s.id) player.loadVideoById(s.id);
    else {player.loadPlaylist({listType:'search',list:s.search});player.playVideo();}
}

function next(){if(idx<playlist.length-1)play(idx+1);}
function prev(){if(idx>0)play(idx-1);}
function togglePP(){const b=document.getElementById('pp');if(playing){player.pauseVideo();b.innerText='▶️ Play';}else{player.playVideo();b.innerText='⏸️ Pausa';}playing=!playing;}
function setNow(){document.getElementById('curTitle').innerText=playlist[idx].title;document.getElementById('curArtist').innerText=playlist[idx].artist;}

function render(){
    const c=document.getElementById('list');c.innerHTML='';
    playlist.forEach((s,i)=>{
        const d=document.createElement('div');d.className='song';d.dataset.i=i;d.onclick=()=>play(i);
        d.innerHTML=`<div class="num">${i+1}</div><div class="info"><div class="t">${s.title}</div><div class="a">${s.artist}</div></div>${s.pauseAfter?'<span class="badge">⏸️ Pausa</span>':''}${s.isBirthday?'<span class="badge">🎂 Final</span>':''}<button class="search-btn" onclick="event.stopPropagation();openSearch('${encodeURIComponent(s.search||s.title+' '+s.artist)}')" title="Ver video oficial">🔎</button>`;
        c.appendChild(d);
    });
}

function hl(){document.querySelectorAll('.song').forEach((el,i)=>{el.classList.toggle('playing',i===idx);if(i===idx)el.scrollIntoView({behavior:'smooth',block:'center'});});}
function openSearch(q){window.open('https://www.youtube.com/results?search_query='+q,'_blank');}
function fs(){document.body.classList.toggle('fs-mode');}
function toast(m){const t=document.createElement('div');t.className='toast';t.innerText=m;document.body.appendChild(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),400);},4000);}
</script>
</body>
</html>
