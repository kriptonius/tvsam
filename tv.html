<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Player SALVATORE - TV</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1120;color:#EDEFF3;font-family:'Segoe UI',Roboto,Arial,sans-serif}
  .app{width:100%;height:100%;display:flex;flex-direction:column;padding:3vh 4vw 0}
  header{display:flex;align-items:baseline;gap:1.2vw;margin-bottom:2.5vh}
  header h1{font-size:4.2vh;font-weight:800;letter-spacing:.05em;color:#a5b4fc}
  header h1 b{color:#22d3ee;text-shadow:0 0 12px rgba(34,211,238,.6)}
  header span{font-size:2.2vh;color:#94a3b8}
  .grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:17vh;gap:2vh 1.6vw;align-content:start;overflow-y:auto;overflow-x:hidden;padding:1.2vh .8vw;scrollbar-width:none}
  .grid::-webkit-scrollbar{display:none}
  .card{border-radius:2vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;font-size:2.8vh;font-weight:700;text-align:center;padding:1vh;
    background:#1e293b;border:.5vh solid transparent;transition:transform .12s,box-shadow .12s}
  .card .ic{font-size:6vh}
  .card.fantoms{background:linear-gradient(135deg,#f97316,#ea580c)}
  .card.tv{background:linear-gradient(135deg,#2563eb,#1e40af)}
  .card .tag{font-size:1.8vh;font-weight:600;opacity:.8}
  .card.focus{transform:scale(1.07);border-color:#fff;box-shadow:0 0 3vh rgba(34,211,238,.7)}
  .bar{height:13vh;margin:1.5vh -4vw 0;padding:0 4vw;background:#111a2e;border-top:.4vh solid #22d3ee;display:flex;align-items:center;justify-content:space-between}
  .bar .name{font-size:4vh;font-weight:800;color:#fff}
  .bar .st{font-size:2.4vh;color:#94a3b8;margin-top:.5vh}
  .bar .hint{font-size:2.2vh;color:#64748b;text-align:right;line-height:1.5}
  .dot{display:inline-block;width:1.6vh;height:1.6vh;border-radius:50%;background:#5DDD8F;margin-right:1vw;animation:p 1.2s infinite}
  #vid{position:fixed;inset:0;width:100%;height:100%;background:#000;display:none;z-index:10;object-fit:contain}
  #banner{position:fixed;left:4vw;bottom:6vh;z-index:11;display:none;background:rgba(11,17,32,.88);border-left:.8vh solid #22d3ee;padding:2vh 3vw;border-radius:1.5vh}
  #banner .n{font-size:5vh;font-weight:800}#banner .s{font-size:2.6vh;color:#94a3b8;margin-top:.6vh}
  @keyframes p{50%{opacity:.3}}
</style>
</head>
<body>
<div class="app">
  <header><h1>AUDIO PLAYER <b>SALVATORE</b></h1><span>Escucha la radio. Descubre la música.</span></header>
  <div class="grid" id="grid"></div>
  <div class="bar">
    <div><div class="name" id="npName">Elige una emisora</div><div class="st" id="npStatus">Usa las flechas y OK</div></div>
    <div class="hint">▶⏸ Pausa / Reanudar<br>⏹ o ← Atrás: Detener<br>TV: ↑↓ o CH± cambian de canal</div>
  </div>
</div>
<video id="vid" playsinline></video>
<div id="banner"><div class="n" id="bnName"></div><div class="s" id="bnStatus"></div></div>
<audio id="aud" autoplay></audio>
<script>
// ===== Config =====
const PROXY = "https://radtv.netlify.app/radio-proxy"; // solo se usa si el stream es HTTP y la app corre desde https
const FANTOMS_URL = "http://157.245.247.5:8000/stream";
const RB = ["https://de1.api.radio-browser.info","https://de2.api.radio-browser.info","https://at1.api.radio-browser.info","https://nl1.api.radio-browser.info"];
// Emisoras fijas (se buscan en Radio-Browser). Agrega más aquí.
const STATIONS = [
  {name:"FANTOMS", icon:"🔥", cls:"fantoms", url:FANTOMS_URL},
  {name:"RPP", icon:"📻", search:"RPP", cc:"PE"},
  {name:"Ritmo Romántica", icon:"💗", search:"Ritmo Romantica", cc:"PE"},
  {name:"Studio 92", icon:"🎵", search:"Studio 92", cc:"PE"},
  {name:"Exitosa", icon:"📰", search:"Exitosa", cc:"PE"},
  {name:"Radio Moda", icon:"🎧", search:"Moda", cc:"PE"},
  {name:"Panamericana", icon:"🇵🇪", search:"Panamericana", cc:"PE"},
  {name:"Radio Nacional", icon:"🎙️", search:"Radio Nacional", cc:"PE"},
  {name:"La Zona", icon:"🔊", search:"La Zona", cc:"PE"},
  {name:"CNN Radio", icon:"🌎", search:"CNN", cc:""},
];
const TV_STATIONS = [
  {name:"ATV", icon:"📺", tv:true, urls:["https://d2b5h5wyivfnfl.cloudfront.net/live/25046411-8673-4dec-8ae8-5b41984f34e1/ts:abr.m3u8", "https://d19e55ehz2il4i.cloudfront.net/ts:abr.m3u8", "https://alba-pe-atv-atv.stream.mediatiquestream.com/index.m3u8", "http://190.93.224.42/ATV/index.m3u8", "http://187.102.210.46/ATV/index.m3u8"]},
  {name:"Latina", icon:"📺", tv:true, urls:["https://redirector.rudo.video/hls-video/567ffde3fa319fadf3419efda25619456231dfea/latina/latina.smil/playlist.m3u8", "https://cablered.iptvperu.tv:1936/cablered/latina_new/playlist.m3u8", "http://190.93.224.42/LATINA/index.m3u8"]},
  {name:"América TV", icon:"📺", tv:true, urls:["https://live-bd1.tv360.bitel.com.pe/manifest/america/master_clean_source.m3u8", "http://45.171.108.253:8888/AMERICA/index.m3u8", "http://190.93.224.42/AMERICA-TV/index.m3u8", "http://bantel-cdn1.iptvperu.tv:1935/btnscrtn/america.stream/playlist.m3u8", "http://187.102.210.46/AMERICA/index.m3u8"]},
  {name:"Panamericana", icon:"📺", tv:true, urls:["http://45.171.108.253:8888/PANAMERICANA/index.m3u8", "http://190.93.224.42/PANAMERICANA/index.m3u8", "http://bantel-cdn1.iptvperu.tv:1935/btnscrtn/panamericana.stream/playlist.m3u8", "http://181.224.200.5:2277/play/kkio/index.m3u8"]},
  {name:"TV Perú", icon:"🇵🇪", tv:true, urls:["https://cdnhd.iblups.com/hls/777b4d4cc0984575a7d14f6ee57dbcaf7.m3u8", "https://cablered.iptvperu.tv:1936/cablered/tvperu_new/playlist.m3u8", "http://190.93.224.42/TV-PERU/index.m3u8", "http://bantel-cdn1.iptvperu.tv:1935/btnscrtn/tvperu.stream/playlist.m3u8", "http://187.102.210.46/TVPERU/index.m3u8", "http://181.224.200.5:2277/play/a0dx/index.m3u8", "http://187.102.208.209:8000/play/a0ay/index.m3u8"]},
  {name:"USMP TV", icon:"🎓", tv:true, urls:["https://streamusmptv.ddns.net/live/stream.m3u8", "http://187.102.210.46/USMP/index.m3u8"]},
  {name:"Willax", icon:"📡", tv:true, urls:["http://190.93.224.42/WILLAX/index.m3u8", "http://187.102.210.46/WILLAX/index.m3u8", "http://170.244.209.30:8000/play/a1id/index.m3u8"]},
  {name:"Canal N", icon:"📰", tv:true, urls:["http://190.108.91.206:9050/play/a0bd/index.m3u8", "http://187.102.208.209:8000/play/a0az/index.m3u8", "http://170.244.209.30:8000/play/a1ib/index.m3u8"]},
];
const ALL = STATIONS.concat(TV_STATIONS);

const grid=document.getElementById('grid'), aud=document.getElementById('aud');
const npName=document.getElementById('npName'), npStatus=document.getElementById('npStatus');
let idx=0, cards=[], playing=null;

ALL.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='card '+(s.cls||'')+(s.tv?' tv':'');
  d.innerHTML=`<span class="ic">${s.icon}</span><span>${s.name}</span>${s.tv?'<span class="tag">TV EN VIVO</span>':''}`;
  d.onclick=()=>{idx=i;focusCard();start(s);};
  grid.appendChild(d); cards.push(d);
});
function focusCard(){cards.forEach((c,i)=>c.classList.toggle('focus',i===idx));try{cards[idx].scrollIntoView({block:'nearest'});}catch(e){}}
focusCard();

async function lookup(s){
  const p=new URLSearchParams({name:s.search,limit:"10",hidebroken:"true",order:"clickcount",reverse:"true"});
  if(s.cc)p.set("countrycode",s.cc);
  for(const sv of RB){
    try{const r=await fetch(sv+"/json/stations/search?"+p);if(!r.ok)continue;
      const j=(await r.json()).filter(x=>x.url_resolved);if(j.length)return j[0].url_resolved;}catch(e){}
  }
  return null;
}
function viaProxy(u){return PROXY+"?url="+encodeURIComponent(u);}

async function play(s){
  stopTV(true);
  playing=s; npName.textContent=s.name; npStatus.textContent="Conectando…";
  let url=s.url||await lookup(s);
  if(!url){npStatus.textContent="No se encontró la emisora ahora mismo";return;}
  const needProxy=url.startsWith('http://') && location.protocol==='https:';
  aud.src=needProxy?viaProxy(url):url;
  aud._raw=url; aud._triedProxy=needProxy; aud._s=s; aud._retries=0;
  aud.play().catch(()=>{});
}
aud.addEventListener('playing',()=>{npStatus.innerHTML='<span class="dot"></span>Sonando ahora';aud._retries=0;});
aud.addEventListener('pause',()=>{if(playing)npStatus.textContent='Pausado';});
aud.addEventListener('waiting',()=>{if(playing)npStatus.textContent='Conectando…';});
aud.addEventListener('error',()=>{
  if(!playing)return;
  if(aud._raw && aud._raw.startsWith('http://') && !aud._triedProxy){ // probar por proxy
    aud._triedProxy=true; aud.src=viaProxy(aud._raw); aud.play().catch(()=>{}); return;
  }
  if(aud._retries<6){ // reconexión automática (útil para FANTOMS)
    aud._retries++; npStatus.textContent='Reconectando… ('+aud._retries+')';
    setTimeout(()=>{if(playing){aud.src=(aud._triedProxy?viaProxy(aud._raw):aud._raw)+(aud._raw.includes('?')?'&':'?')+'_t='+Date.now();aud.play().catch(()=>{});}},Math.min(2000*aud._retries,15000));
  } else npStatus.textContent='Se perdió la señal. Elige la emisora otra vez.';
});
function stopAll(){playing=null;aud.pause();aud.removeAttribute('src');aud.load();npName.textContent='Elige una emisora';npStatus.textContent='Usa las flechas y OK';}
function togglePause(){if(!playing)return;aud.paused?aud.play().catch(()=>{}):aud.pause();}


// ===== TV en vivo (HLS) =====
const vid=document.getElementById('vid'), banner=document.getElementById('banner');
const bnName=document.getElementById('bnName'), bnStatus=document.getElementById('bnStatus');
let tvCur=null, tvIdx=0, tvSrc=0, hls=null, tvTimer=null, bnTimer=null, tvSeq=0;
const NATIVE_HLS = !!vid.canPlayType('application/vnd.apple.mpegurl');

function loadHls(){
  return new Promise((res,rej)=>{
    if(window.Hls) return res();
    const add=src=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=()=>src==='hls.min.js'?add('https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js'):rej();document.head.appendChild(sc);};
    add('hls.min.js');
  });
}
function showBanner(txt){bnName.textContent=tvCur?tvCur.name:'';bnStatus.textContent=txt;banner.style.display='block';clearTimeout(bnTimer);bnTimer=setTimeout(()=>banner.style.display='none',4000);}
function tvUrls(s){ // en https solo se pueden usar señales https; en la app Tizen (file:) sirven todas
  return location.protocol==='https:'?s.urls.filter(x=>x.startsWith('https')):s.urls;
}
function stopTV(silent){
  tvSeq++; clearTimeout(tvTimer); clearTimeout(bnTimer);
  if(hls){try{hls.destroy();}catch(e){} hls=null;}
  try{vid.pause();vid.removeAttribute('src');vid.load();}catch(e){}
  vid.style.display='none'; banner.style.display='none'; tvCur=null;
  if(!silent){npName.textContent='Elige una emisora';npStatus.textContent='Usa las flechas y OK';}
}
function start(s){ if(s.tv)playTV(s); else play(s); }
function playTV(s){
  playing=null; aud.pause(); aud.removeAttribute('src'); aud.load();
  tvCur=s; tvIdx=TV_STATIONS.indexOf(s); tvSrc=0;
  npName.textContent=s.name; npStatus.textContent='TV en vivo';
  vid.style.display='block'; tryTV();
}
function tryTV(){
  const urls=tvUrls(tvCur), seq=++tvSeq;
  if(hls){try{hls.destroy();}catch(e){} hls=null;}
  clearTimeout(tvTimer);
  if(tvSrc>=urls.length){showBanner(urls.length?'Sin señal ahora mismo. ← Atrás para volver':'Esta señal solo funciona en la app instalada (no en https)');return;}
  showBanner('Conectando… ('+(tvSrc+1)+'/'+urls.length+')');
  const url=urls[tvSrc];
  const fail=()=>{if(seq!==tvSeq)return;tvSrc++;tryTV();};
  tvTimer=setTimeout(fail,15000); // si no arranca en 15 s, probar la siguiente señal
  vid.onplaying=()=>{if(seq!==tvSeq)return;clearTimeout(tvTimer);showBanner('En vivo');};
  vid.onerror=fail;
  if(NATIVE_HLS){vid.src=url;vid.play().catch(()=>{});}
  else loadHls().then(()=>{
    if(seq!==tvSeq)return;
    if(!Hls.isSupported()){fail();return;}
    hls=new Hls({maxBufferLength:20,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1,fragLoadingMaxRetry:2});
    hls.on(Hls.Events.ERROR,(ev,d)=>{if(d.fatal)fail();});
    hls.loadSource(url); hls.attachMedia(vid); vid.play().catch(()=>{});
  }).catch(fail);
}
function tvStep(d){ if(!tvCur)return; const n=TV_STATIONS.length, k=(tvIdx+d+n)%n; idx=STATIONS.length+k; focusCard(); playTV(TV_STATIONS[k]); }

// ===== Control remoto (flechas, OK, Atrás, teclas multimedia) =====
const COLS=5;
document.addEventListener('keydown',e=>{
  if(tvCur){ // viendo TV: pantalla completa
    switch(e.keyCode){
      case 38: case 427: tvStep(1); break;
      case 40: case 428: tvStep(-1); break;
      case 13: showBanner(vid.paused?'Pausado':'En vivo'); break;
      case 10252: case 415: case 19: case 179: vid.paused?vid.play().catch(()=>{}):vid.pause(); break;
      case 413: case 178: case 10009: case 8: case 27: stopTV(); break;
      default: return;
    }
    e.preventDefault(); return;
  }
  switch(e.keyCode){
    case 37: if(idx%COLS>0)idx--; break;
    case 39: if(idx%COLS<COLS-1&&idx<cards.length-1)idx++; break;
    case 38: if(idx-COLS>=0)idx-=COLS; break;
    case 40: if(idx+COLS<cards.length)idx+=COLS; else if(idx<cards.length-1&&Math.floor(idx/COLS)<Math.floor((cards.length-1)/COLS))idx=cards.length-1; break;
    case 13: start(ALL[idx]); break;
    case 10252: case 415: case 19: case 179: togglePause(); break; // play/pausa
    case 413: case 178: stopAll(); break;                          // stop
    case 10009: case 8: case 27: // Atrás
      if(playing)stopAll(); else if(window.tizen)tizen.application.getCurrentApplication().exit(); break;
    default: return;
  }
  e.preventDefault(); focusCard();
});
// Registrar teclas multimedia del control Samsung
try{ if(window.tizen&&tizen.tvinputdevice){['MediaPlayPause','MediaPlay','MediaPause','MediaStop','ChannelUp','ChannelDown'].forEach(k=>{try{tizen.tvinputdevice.registerKey(k);}catch(e){}});} }catch(e){}
</script>
</body>
</html>
